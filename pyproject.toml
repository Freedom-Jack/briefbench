[project]
name = "briefbench"
version = "0.1.0"
description = "A prompt-improving skill, and a small bench that checks on your own tasks whether it helps."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# None: every model call goes through an agent CLI logged in with your subscription (docs/design.md, "Decisions").
dependencies = []

[project.scripts]
briefbench = "briefbench.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not live"]
markers = [
    "live: real agent CLI calls on your subscriptions; run with: uv run pytest -m live",
]
