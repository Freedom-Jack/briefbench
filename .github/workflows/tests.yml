# Offline tests, on every pull request and on every push to main.
# Live tests (uv run pytest -m live) never run in CI: they call real agent CLIs and need
# the maintainer's subscription logins. pyproject.toml deselects them by default.
name: tests

on:
  pull_request:
  push:
    branches: [main]

# A read-only token, no secrets and no pull_request_target, so code from a fork runs without privileges.
permissions:
  contents: read

jobs:
  offline:
    name: offline tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run pytest
