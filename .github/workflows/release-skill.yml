# Drafts a release of the brief skill when the maintainer pushes a tag brief--v<version>.
# The build job has a read-only token. It reruns the offline tests (they check that plugin.json, the marketplace
# files and CHANGELOG.md match SKILL.md's metadata.version, and that the skill's hash matches its changelog entry),
# refuses a tag that names another version, builds the reproducible ZIP with scripts/package_skill.py and writes
# the notes. Only the release job can write, and it checks out and runs no project code: it drafts the release
# from the build's files. Publishing the draft stays a person's decision. Nothing here runs on pull requests.
name: release-skill

on:
  push:
    tags: ["brief--v*"]

permissions:
  contents: read

jobs:
  build:
    name: build and check the skill release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run pytest
      - name: Build the ZIP and the notes
        id: build
        shell: bash   # -eo pipefail, so a failed build isn't hidden by tee
        run: |
          version="${GITHUB_REF_NAME#brief--v}"
          uv run python scripts/package_skill.py --out dist | tee package.txt
          if ! grep -qxF "version: $version" package.txt; then
            echo "::error::the tag names $version, but SKILL.md says $(sed -n 's/^version: //p' package.txt)"
            exit 1
          fi
          {
            awk -v head="## brief $version " 'index($0, head) == 1 {on = 1; next} /^## / {on = 0} on' CHANGELOG.md
            echo
            echo "Install and update: see the README. Checksums:"
            echo
            echo '```text'
            grep -e '^zip sha256: ' -e '^bench skill hash' package.txt
            echo '```'
          } > dist/notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: skill-release
          path: dist/
          if-no-files-found: error

  release:
    name: draft the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write   # to create the draft release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: skill-release
          path: dist
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: >
          gh release create "$GITHUB_REF_NAME" "dist/brief-$VERSION.zip"
          --draft --verify-tag --title "brief $VERSION" --notes-file dist/notes.md
